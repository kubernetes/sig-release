releasenote:
  text: |-
    Added `resource.MaxMilliQuantity()`, which returns the largest quantity whose `MilliValue()` and `ScaledValue(resource.Milli)` do not overflow an int64. For a non-negative quantity, compare it against this bound with `Quantity.Cmp` before calling `MilliValue()` or `ScaledValue(resource.Milli)`.
