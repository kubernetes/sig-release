pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind bug\r\n\r\n<!--\r\nAdd one of the following
  kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind documentation\r\n/kind
  feature\r\n\r\nOptionally add one or more of the following kinds if applicable:\r\n/kind
  api-change\r\n/kind deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n\r\n####
  What this PR does / why we need it:\r\n\r\nThis PR fixes a bug that prevents the
  StatefulSet controller from reconciling pods when there are existing pods with certain
  names.\r\n\r\nBefore this PR, the StatefulSet controller's `isMemberOf` treats a
  pod whose name has a leading-zero ordinal as a member, e.g., `sts-01`.\r\n```\r\nfunc
  isMemberOf(set *apps.StatefulSet, pod *v1.Pod) bool {\r\n    parent, _ := getParentNameAndOrdinal(pod)\r\n
  \   return parent == set.Name // \"sts-01\" is allowed to be a member of `sts`\r\n}\r\n```\r\nHowever,
  later the StatefulSet controller will try to update the pod, including updating
  the pod name from `sts-01` to `sts-1`:\r\n```\r\nfunc updateIdentity(set *apps.StatefulSet,
  pod *v1.Pod) {\r\n\tordinal := getOrdinal(pod)\r\n\tpod.Name = getPodName(set, ordinal)
  // \"sts-01\" -> \"sts-1\"\r\n\t...\r\n}\r\n```\r\nThe update request to the API
  server is destined to fail because the name is immutable. The StatefulSet controller
  cannot make progress as long as `sts-01` still exists.\r\n\r\nThis PR fixes the
  bug by enhancing the membership check to:\r\n```\r\nfunc isMemberOf(set *apps.StatefulSet,
  pod *v1.Pod) bool {\r\n\tparent, ordinal := getParentNameAndOrdinal(pod)\r\n\treturn
  ordinal >= 0 &&\r\n\t\tparent == set.Name &&\r\n\t\tpod.Name == getPodName(set,
  ordinal) // this line rejects leading-zero ordinal\r\n}\r\n```\r\nSo pods like `sts-01`
  will no longer be treated as a member and will not block the StatefulSet controller.\r\n\r\nThis
  PR also enhances existing tests to cover the leading-zero case.\r\n\r\n#### Which
  issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to help with
  tracking.\r\n\r\nTo automatically close the linked issue(s) when this PR is merged,\r\nadd
  the word \"Fixes\" before the issue number or link.\r\nDo not use \"Fixes\" if the
  PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs when applicable in
  addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue number>\r\n<issue
  link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\nN/A\r\n\r\n####
  Special notes for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing
  change?\r\n<!--\r\nIf no, just write \"NONE\" in the release-note block below.\r\nIf
  yes, a release note is required:\r\nEnter your extended release note in the block
  below. If the PR requires additional action from users switching to the new release,
  include the string \"action required\".\r\n\r\nFor more information on release notes
  see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nTighten
  StatefulSet pod names to match the form <pod-name>-<ordinal> without leading 0.
  (for example web-01 for StatefulSet web). Previously the controller would adopt
  such a Pod as ordinal 1 and could treat it as the replica in place of the real web-1.\r\n```\r\n\r\n####
  Additional documentation e.g., KEPs (Kubernetes Enhancement Proposals), usage docs,
  etc.:\r\n\r\n<!--\r\nThis section can be blank if this pull request does not require
  a release note.\r\n\r\nWhen adding links which point to resources within git repositories,
  like\r\nKEPs or supporting documentation, please reference a specific commit and
  avoid\r\nlinking directly to the master branch. This ensures that links reference
  a\r\nspecific point in time, rather than a document that may change over time.\r\n\r\nSee
  here for guidance on getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Tightened StatefulSet Pod name validation to require the form `<pod-name>-<ordinal>`
    without leading zeros (for example, `web-01` for StatefulSet `web`). Previously,
    the controller adopted such a Pod as ordinal 1 and could treat it as a replica
    in place of `web-1`.
