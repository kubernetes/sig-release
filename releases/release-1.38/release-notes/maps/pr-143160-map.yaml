pr: 143160
pr_body: ""
releasenote:
  text: |-
    Added the `staticOrder` field to `WebhookAdmissionConfiguration` for the `MutatingAdmissionWebhook` plugin (KEP-5793). It controls whether manifest-based mutating webhooks run before webhooks registered through the API (`StaticFirst`, the default), after them (`StaticLast`), or sorted together with them by configuration name (`ByName`). It requires `staticManifestsDir` and the `ManifestBasedAdmissionControlConfig` feature gate. Remove `staticOrder` before downgrading to v1.37 or earlier, because those versions reject it at startup.
  sigs:
  - api-machinery
  - auth
  - testing
