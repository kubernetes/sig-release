releasenote:
  text: 'ACTION REQUIRED: Added a `Type()` method to the `kube-scheduler` framework
    interface `PreemptionVictim` and replaced `PreemptionCandidate.NumPodGroupDisruptions()`
    with `NumDisruptionsByVictimType()`. Update out-of-tree implementations of these
    interfaces. Added a `victim` label (`pod`, `podgroup`, `compositepodgroup`) to
    the Alpha metric `scheduler_preemption_workload_disruptions`. Standalone Pods evicted
    by a workload preemption are counted as `victim=pod`, and Pods of groups with `DisruptionMode=Single`
    are counted as `victim=pod` instead of as group disruptions. During workload preemption,
    Pods of PodGroups or CompositePodGroups with `DisruptionMode=Single` rank as individual
    Pods when choosing victims, instead of above standalone Pods of the same priority.'
