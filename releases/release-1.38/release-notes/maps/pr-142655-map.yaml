releasenote:
  text: Updated `k8s.io/apiserver` so that `webhook.New` takes a compiled `webhook.Matcher`
    instead of match conditions and a CEL compiler, `webhook.NewFromInterface` dropped
    its compiler argument, `authorizerfactory.DelegatingAuthorizerConfig.Compiler`
    was removed, and `validation.ValidateAndCompileMatchConditions` was replaced by
    `validation.NewWebhookMatcher`.
