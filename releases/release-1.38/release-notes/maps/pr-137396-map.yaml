pr: 137396
pr_body: "#### What type of PR is this?\r\n\r\n/kind feature\r\n\r\n#### What this
  PR does / why we need it:\r\n\r\nAdd a new controller for imperative eviction responder
  that works with EvictionRequest API \r\n\r\n#### Which issue(s) this PR is related
  to:\r\n\r\nTracking Issue: https://github.com/kubernetes/enhancements/issues/4563\r\n<!--\r\nPlease
  link relevant issues to help with tracking.\r\n\r\nTo automatically close the linked
  issue(s) when this PR is merged,\r\nadd the word \"Fixes\" before the issue number
  or link.\r\nDo not use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference
  KEPs when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\nDepends on:\r\n- https://github.com/kubernetes/kubernetes/pull/137050\r\n-
  https://github.com/kubernetes/kubernetes/pull/137133\r\n\r\nOnce the responder and
  evictionrequest controllers have merged, we will add E2E tests.\r\n\r\nTODO:\r\n-
  [x] controller logic\r\n- [x] tests\r\n\r\n#### Does this PR introduce a user-facing
  change?\r\n<!--\r\nIf no, just write \"NONE\" in the release-note block below.\r\nIf
  yes, a release note is required:\r\nEnter your extended release note in the block
  below. If the PR requires additional action from users switching to the new release,
  include the string \"action required\".\r\n\r\nFor more information on release notes
  see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nIntroduce
  a new imperative-eviction.k8s.io/evictor responder controller for pods. This responder
  is executed last, after all other responders have run, and attempts to evict a pod
  using the imperative eviction API (pods/<name>/eviction subresource). It fulfills
  \ the declarative Eviction API contract.\r\n```\r\n\r\n#### Additional documentation
  e.g., KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis
  section can be blank if this pull request does not require a release note.\r\n\r\nWhen
  adding links which point to resources within git repositories, like\r\nKEPs or supporting
  documentation, please reference a specific commit and avoid\r\nlinking directly
  to the master branch. This ensures that links reference a\r\nspecific point in time,
  rather than a document that may change over time.\r\n\r\nSee here for guidance on
  getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Introduced the `imperative-eviction.k8s.io/evictor` responder controller for
    Pods. This responder is executed last, after all other responders have run, and
    attempts to evict a Pod using the imperative eviction API (`pods/<name>/eviction`
    subresource), fulfilling the declarative Eviction API contract.
