releasenote:
  text: |-
    Added the `clientCertificateKeyAlgorithm` and `serverCertificateKeyAlgorithm` fields to `KubeletConfiguration`, so the `kubelet` can request client and server certificates with ECDSA, RSA, or ML-DSA keys. The default remains ECDSA-P256.
