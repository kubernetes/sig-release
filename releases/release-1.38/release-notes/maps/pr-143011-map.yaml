pr: 143011
pr_body: ""
releasenote:
  text: |-
    Changed `metav1.FieldsV1` in `ObjectMeta.ManagedFields` to store its contents as an interned string by default, so Go code can no longer access the `Raw` byte slice directly. Use the accessor methods instead: `GetRawBytes`, `GetRawString`, `SetRawBytes`, `SetRawString`, `GetRawReader`, and `NewFieldsV1`. To keep the previous `Raw []byte` field, build with `-tags=fieldsv1byte`. The JSON, CBOR, and protobuf wire formats and the published OpenAPI are unchanged.
