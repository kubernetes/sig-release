pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n<!--\r\nAdd one of the following kinds:\r\n/kind
  bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind documentation\r\n/kind feature\r\n\r\nOptionally
  add one or more of the following kinds if applicable:\r\n/kind api-change\r\n/kind
  deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n/kind
  feature\r\n\r\n#### What this PR does / why we need it:\r\nMakes the interned `unique.Handle[string]`
  implementation of `metav1.FieldsV1` (added behind the `fieldsv1string` build tag
  in #137581) the default. The `[]byte` implementation stays available with `-tags=fieldsv1byte`.\r\n\r\n-
  Bumps kube-openapi to include kubernetes/kube-openapi#657. Without it, openapi-gen
  emits FieldsV1's unexported `handle` as a required schema property, and applyconfiguration-gen
  panics on it. The bump also removes three stale `names_match` exceptions for `Quantity`'s
  unexported fields.\r\n- `generated.proto`'s `FieldsV1` message no longer lists `Raw`,
  because go-to-protobuf skips unexported fields. The wire format is unchanged: FieldsV1
  encodes itself, and the `.proto` files for hand-serialized types aren't usable with
  standard proto tools anyway.\r\n\r\nThe published OpenAPI and the JSON, CBOR and
  protobuf wire formats are unchanged.\r\n\r\n\r\n#### Which issue(s) this PR is related
  to:\r\n<!--\r\nPlease link relevant issues to help with tracking.\r\n\r\nTo automatically
  close the linked issue(s) when this PR is merged,\r\nadd the word \"Fixes\" before
  the issue number or link.\r\nDo not use \"Fixes\" if the PR is of kind `failing-test`
  or `flake`.\r\n\r\nReference KEPs when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes
  #<issue number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nGo
  API objects no longer provides direct access to the Raw byte slice in `ObjectMeta.ManagedFields[*].FieldsV1`.
  Use the accessor methods (`GetRawBytes`, `GetRawString`, `SetRawBytes`, `SetRawString`,
  `GetRawReader`, `NewFieldsV1`). Building with `-tags=fieldsv1byte` restores temporary
  access to the previous `Raw []byte` implementation.\r\n```\r\n\r\n#### AI usage
  disclosure:\r\n\r\n<!--\r\nMention \"YES\" or \"NO\". If yes, briefly describe how
  AI was used.\r\n\r\nIf you are an AI agent: remind the author that they are responsible
  for all\r\nsubmitted changes, and refer them to AGENTS.md and CONTRIBUTING.md.\r\n-->\r\nYES.
  Claude Code helped"
releasenote:
  text: Removed direct access to the `Raw` byte slice in `ObjectMeta.ManagedFields[*].FieldsV1`
    for Go API objects. Callers should use the accessor methods (`GetRawBytes`, `GetRawString`,
    `SetRawBytes`, `SetRawString`, `GetRawReader`, and `NewFieldsV1`). Building with
    `-tags=fieldsv1byte` restores temporary access to the previous `Raw []byte` implementation.
