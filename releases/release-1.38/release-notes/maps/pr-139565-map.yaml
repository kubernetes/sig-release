  Fixes https://github.com/kubernetes/kubernetes/issues/139346
  KEP: https://github.com/kubernetes/enhancements/issues/5732

  #### Special notes for your reviewer:

  - Plugins run sequentially, each with a separate parent placement pointer to isolate per-plugin state.
  - State is cloned when merging candidates and when seeding placement evaluation. Intermediate merged-parent state cleanup stays internal to the scheduler.
  - Placement names must be unique within each plugin and must not contain `/`, so joined diagnostic names remain unambiguous. Empty names remain allowed, and different plugins may use the same name because state identity is pointer-based.
  - Integration coverage intersects a topology placement with a node-pool placement so only one rack can fit the gang. The TAS performance configuration retains both the upstream score-all-placements baseline and the multi-plugin workloads.

  Local validation on macOS arm64, rebased onto `a0788855ed86ec13c7941d7f3a4deaa0473bd57d`:

  - `PATH="/opt/homebrew/bin:$PATH" make test WHAT='./pkg/scheduler/... ./staging/src/k8s.io/kube-scheduler/framework/...' GOFLAGS='-count=1'` - passed, 5,950 tests with the default race detector.
  - `PATH="/opt/homebrew/bin:$PATH" hack/verify-golangci-lint.sh -r upstream/master` - passed, zero issues.
  - `PATH="/opt/homebrew/bin:$PATH" hack/verify-golangci-lint.sh -r upstream/master -n` - passed, zero issues.
  - `PATH="/opt/homebrew/bin:$PATH" SILENT=false make verify WHAT='boilerplate gofmt typecheck'` - passed, including all configured typecheck platforms.
  - `PATH="$PWD/third_party/etcd:/opt/homebrew/bin:$PATH" go test ./test/integration/scheduler/podgroup/topology_aware_scheduling -run '^TestTopologyAwareSchedulingWithMultiplePlacementPlugins$' -count=1` - passed.
  - `PATH="$PWD/third_party/etcd:/opt/homebrew/bin:$PATH" go test ./test/integration/scheduler_perf/podgroup/tas -run '^TestSchedulerPerf$' -short -count=1` - passed.

