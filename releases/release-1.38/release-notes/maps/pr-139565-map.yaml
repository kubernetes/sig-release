  /kind feature

  #### What this PR does / why we need it:

  Lets multiple PlacementGenerate plugins run for the same PodGroup under TAS. The framework runs every configured generator against the same input node set, takes the cross product of their candidate placements, and intersects each pair's node lists so a final placement satisfies every constraining plugin.

  Plugins attach per-placement data through the lazy, pointer-keyed `PodGroupCycleState.PlacementState(*Placement)` API. They return the exact placement pointers used to store that data. The framework clones and combines state for merged placements, rejects conflicting state keys, and carries the generated state into both regular and composite pod-group placement evaluation.

  A plugin returning its unchanged parent placement alone imposes no constraints. State attached to that parent is ignored; group-wide data belongs directly in `PodGroupCycleState`. A single constraining plugin retains its original placement pointers, names, and node lists, subject to the name-validation rules below.

  #### Which issue(s) this PR is related to:
  <!--
  Please link relevant issues to help with tracking.

  To automatically close the linked issue(s) when this PR is merged,
  add the word "Fixes" before the issue number or link.
  Do not use "Fixes" if the PR is of kind `failing-test` or `flake`.

  Reference KEPs when applicable in addition to specific issues.

  Examples:
