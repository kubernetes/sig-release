  #### What type of PR is this?

  /kind cleanup

  #### What this PR does / why we need it:

  Renames the entity label on `scheduler_queued_entities` and
  `scheduler_queue_incoming_entities_total` from `type` to `entity`, matching
  the topology-aware placement metrics. `type` is also ambiguous next to
  `scheduler_cache_size{type}`, where it means the cached object kind.

  Follow-up to https://github.com/kubernetes/kubernetes/pull/141800 after discussion in https://github.com/kubernetes/kubernetes/pull/141929#discussion_r4313296178.


  #### Which issue(s) this PR is related to:
  KEP: [KEP-6012](https://github.com/kubernetes/enhancements/tree/master/keps/sig-scheduling/6012-composite-podgroup-api#readme)

  #### Special notes for your reviewer:
  /sig scheduling
  /wg workload-aware-scheduling


