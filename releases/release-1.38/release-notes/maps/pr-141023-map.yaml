releasenote:
  text: |-
    Made the CompositePodGroup `spec.schedulingPolicy.gang.minGroupCount` field mutable, including in CompositePodGroup templates in a Workload. A change applies only to Pods that have not been scheduled. When the value decreases, `kube-scheduler` re-enqueues the Pods in that CompositePodGroup hierarchy.
