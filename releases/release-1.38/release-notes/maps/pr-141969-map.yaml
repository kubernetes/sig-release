releasenote:
  text: Added CompositePodGroup support to preemption metrics. Added a `preemptor`
    label (`podgroup` or `compositepodgroup`) to the alpha metrics `scheduler_workload_preemption_attempts_total`
    and `scheduler_workload_preemption_victims`, and updated `scheduler_preemption_evaluation_duration_seconds`
    to distinguish `compositepodgroup` preemptors.
