pr_body: "#### What type of PR is this?\r\n\r\n/kind cleanup\r\n/sig scheduling\r\n\r\n####
  What this PR does / why we need it:\r\n\r\nRemoves the `MatchLabelKeysInPodAffinity`
  feature gate, which graduated to GA in Kubernetes 1.33 and was locked to default.
  Also cleans up the now unused field dropping logic and helper functions in `pkg/api/pod`.\r\n\r\n####
  Which issue(s) this PR is related to:\r\n\r\nKEP: https://github.com/kubernetes/enhancements/issues/3633\r\n\r\n####
  Special notes for your reviewer:\r\n\r\nNone\r\n\r\n#### Does this PR introduce
  a user-facing change?\r\n\r\n```release-note\r\nThe `MatchLabelKeysInPodAffinity`
  feature gate has been removed.\r\n```\r\n\r\n#### Additional documentation e.g.,
  KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n- [KEP]: https://github.com/kubernetes/enhancements/issues/3633\r\n\r\n####
  AI usage disclosure:\r\n\r\nYES: AI was used to assist with the implementation and
  tests. The author carefully reviewed the code before creating the PR."
releasenote:
  text: Removed the `MatchLabelKeysInPodAffinity` feature gate.
