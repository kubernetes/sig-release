pr: 142962
pr_body: ""
releasenote:
  text: |-
    Promoted the workload-aware scheduling building-block types (for example, `WorkloadPodGroupSchedulingPolicy` and `WorkloadPodGroupSchedulingConstraints`) from `scheduling.k8s.io/v1alpha3` to `scheduling.k8s.io/v1` for the KEP-6089 beta milestone; the `v1alpha3` Go types remain as aliases. `WorkloadPodGroupSchedulingConstraints.Topology` and `WorkloadCompositePodGroupSchedulingConstraints.Topology` now use `WorkloadTopologyConstraint` instead of `v1alpha3.TopologyConstraint`, so external controllers must update the element type. The corresponding apply configurations moved to `k8s.io/client-go/applyconfigurations/scheduling/v1`.
