pr: 140140
pr_body: ''
releasenote:
  text: |-
    Added Beta support for compressed responses to `WatchList` requests. When a client sends `Accept-Encoding: gzip`, the API server returns a gzip compressed response. This behavior is enabled by default and can be disabled using the `WatchListCompression` feature gate. Regular `watch` requests are unaffected.
  sigs:
  - api-machinery
  kinds:
  - feature
  areas:
  - apiserver
