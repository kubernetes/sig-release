  What type of PR is this?\r\n\r\n/kind bug\r\n\r\n#### What this PR does / why we
  need it:\r\nFixes the check for relative paths to be cross-platform.\r\n\r\n####
  Which issue(s) this PR is related to:\r\nFixes https://github.com/kubernetes/kubectl/issues/1644\r\n\r\n####
  Special notes for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing
  change?\r\nIt fixes the noted bug for Windows users.\r\n\r\n```release-note\r\nSetting
  a certificate authority path that is outside of the `.kube/config` folder on Windows
  will no longer result in a relative path being used to match the behavior on other
  OS. \r\n```\r\n\r\n#### Additional documentation e.g., KEPs (Kubernetes Enhancement
  Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis section can be blank if this pull
