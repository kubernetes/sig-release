pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n/kind feature\r\n/kind api-change\r\n\r\n#### What this
  PR does / why we need it:\r\nThis PR implements alpha support for **`DRAOptionalNodeOperations`**.
  It enables Dynamic Resource Allocation (DRA) drivers to declare that node-local
  operations (preparation and clean-up) are optional for devices, allowing `kubelet`
  to bypass gRPC `NodePrepareResources` and `NodeUnprepareResources` calls when not
  required.\r\n\r\nDetailed breakdown by commit:\r\n1. register `DRAOptionalNodeOperations`
  feature gate\r\n2. api: introduce `SkipNodeOperations` alpha field to DRA ResourceSlice
  and ResourceClaim\r\n3. resourceslice controller\r\n4. make update\r\n5. nodedeclaredfeatures:
  register `DRAOptionalNodeOperations` feature\r\n6. DRA scheduler plugin and allocator\r\n7.
  kubelet: bypass gRPC preparation and clean-up when `SkipNodeOperations` is set\r\n8.
  test/integration/scheduler: verify scheduling and filtering for `DRAOptionalNodeOperations`\r\n9.
  test/e2e/dra: add test scenarios for `DRAOptionalNodeOperations`\r\n\r\n#### Which
  issue(s) this PR is related to:\r\nKEP: https://github.com/kubernetes/enhancements/issues/5945\r\n\r\n####
  Special notes for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing
  change?\r\n```release-note\r\nDRA: Introduced alpha support for `DRAOptionalNodeOperations`
  (`SkipNodeOperations` field in ResourceSlice and ResourceClaim) to allow skipping
  node-level preparation and cleanup operations.\r\n```\r\n\r\n#### Additional documentation
  e.g., KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis
  section can be blank if this pull request does not require a release note.\r\n\r\nWhen
  adding links which point to resources within git repositories, like\r\nKEPs or supporting
  documentation, please reference a specific commit and avoid\r\nlinking directly
  to the master branch. This ensures that links reference a\r\nspecific point in time,
  rather than a document that may change over time.\r\n\r\nSee here for guidance on
  getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n[KEP]: https://github.com/troychiu/enhancements/blob/40f7cf66928113e43a43cefbe655a8ee18f5bdde/keps/sig-node/5945-dra-optional-node-preparation/README.md\r\n```"
releasenote:
  text: 'DRA: Introduced alpha support for `DRAOptionalNodeOperations` (`SkipNodeOperations`
    field in ResourceSlice and ResourceClaim) to allow skipping node-level preparation
    and cleanup operations.'
