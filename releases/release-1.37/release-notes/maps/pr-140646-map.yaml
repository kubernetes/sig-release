  | 7658 Skipped\r\nPASS\r\n```\r\n\r\n#### Which issue(s) this PR is related to:\r\n\r\nFixes
  https://github.com/kubernetes/kubernetes/issues/140640\r\n\r\nRelease-blocking deferred
  resize tests are failing: https://kubernetes.slack.com/archives/C0BP8PW9G/p1784209836363889\r\n\r\n####
  Special notes for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing
  change?\r\n<!--\r\nIf no, just write \"NONE\" in the release-note block below.\r\nIf
