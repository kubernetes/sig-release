pr: 140590
pr_body: "#### What type of PR is this?\r\n\r\n/kind bug\r\n\r\n#### What this PR
  does / why we need it:\r\n\r\nRight now, when a Pod evaluated successfully during
  the pod group cycle, but the PodGroup still failed, we set NNN from the suggested
  host instead of from the pod group preemption. \r\n\r\n#### Which issue(s) this
  PR is related to:\r\n\r\n#### Special notes for your reviewer:\r\n\r\n#### Does
  this PR introduce a user-facing change?\r\n\r\n```release-note\r\nFixed a case where
  Pods from PodGroup that evaluated successfully during the pod group cycle that eventually
  failed would have NNN set from this evaluation instead of from Pod Group preemption.\r\n```\r\n\r\n####
  Additional documentation e.g., KEPs (Kubernetes Enhancement Proposals), usage docs,
  etc.:\r\n"
releasenote:
  text: Fixed a case where Pods in a PodGroup that were successfully evaluated during
    a failed PodGroup scheduling cycle had `nominatedNodeName` set from that evaluation
    instead of from PodGroup preemption.
