pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind feature\r\n/kind api-change\r\n<!--\r\nAdd
  one of the following kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind
  documentation\r\n\r\nOptionally add one or more of the following kinds if applicable:\r\n/kind
  deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n\r\n####
  What this PR does / why we need it:\r\n\r\nImplement DRA DerivedAttributes, available
  as alpha (http://kep.k8s.io/6080)\r\n\r\n#### Which issue(s) this PR is related
  to:\r\n<!--\r\nPlease link relevant issues to help with tracking.\r\n\r\nTo automatically
  close the linked issue(s) when this PR is merged,\r\nadd the word \"Fixes\" before
  the issue number or link.\r\nDo not use \"Fixes\" if the PR is of kind `failing-test`
  or `flake`.\r\n\r\nReference KEPs when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes
  #<issue number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\nThere is an intentional breaking change to a Go type in
  this PR. Specifically, the Go type for the `MatchAttribute` and `DistinctAttribute`
  fields in `DeviceConstraint` has been changed from `FullyQualifiedName` to `QualifiedName`.
  \ This change was made to accommodate attribute names without a domain prefix (for
  example, allowing `my-attribute` instead of requiring a domain like `example.com/my-attribute`)
  for derived attributes, which provides a better experience for users.\r\n\r\nWhile
  this introduces a breaking change for Go code that directly references these fields,
  it is fully backward-compatible on the wire, meaning there is no change to the serialized
  API. \r\n\r\nGo developers will need to update their code to use `resource.QualifiedName`
  instead of `resource.FullyQualifiedName` when interacting with these fields.\r\n\r\n\r\n\r\n####
  Does this PR introduce a user-facing change?\r\n<!--\r\nIf no, just write \"NONE\"
  in the release-note block below.\r\nIf yes, a release note is required:\r\nEnter
  your extended release note in the block below. If the PR requires additional action
  from users switching to the new release, include the string \"action required\".\r\n\r\nFor
  more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nAdded
  support for derived attributes in DRA, allowing claims to define virtual attributes
  using CEL expressions and use them in device constraints. This enables co-allocation
  of devices across different domains (e.g. GPUs and NICs on the same NUMA node) even
  if their drivers publish physical attributes differently.\r\n```\r\n\r\n#### Additional
  documentation e.g., KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis
  section can be blank if this pull request does not require a release note.\r\n\r\nWhen
  adding links which point to resources within git repositories, like\r\nKEPs or supporting
  documentation, please reference a specific commit and avoid\r\nlinking directly
  to the master branch. This ensures that links reference a\r\nspecific point in time,
  rather than a document that may change over time.\r\n\r\nSee here for guidance on
  getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n-->\r\n```docs\r\n- [KEP]:
  https://github.com/kubernetes/enhancements/issues/6080\r\n- [Usage]: None\r\n- [Other
  doc]: None\r\n```\r\n"
releasenote:
  text: Added support for derived attributes in DRA, allowing claims to define virtual
    attributes using CEL expressions and use them in device constraints. This enables
    co-allocation of devices across different domains (e.g. GPUs and NICs on the same
    NUMA node) even if their drivers publish physical attributes differently.
