pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n<!--\r\nAdd one of the following kinds:\r\n/kind
  bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind documentation\r\n/kind feature\r\n\r\nOptionally
  add one or more of the following kinds if applicable:\r\n/kind api-change\r\n/kind
  deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n\r\n/kind
  bug\r\n\r\n#### What this PR does / why we need it:\r\n\r\nresource.Quantity embeds
  a pointer indirectly. Therefore, copying a Quantity value can copy the *inf.Dec
  pointer while preserving its reference to same mutable decimal object. Mutating
  copied Quantity may then mutate decimal value held by original Quantity.\r\n\r\n```\r\n
  \ type Quantity struct {\r\n      // Used when quantity fits in scaled int64 form.\r\n
  \     i int64Amount\r\n\r\n      // Used for decimal representation.\r\n      d
  infDecAmount\r\n\r\n      s string\r\n      Format\r\n  }\r\n\r\n  type infDecAmount
  struct {\r\n      *inf.Dec\r\n  }\r\n```\r\n\r\n  `CmpRequestOverCapacity()` operates
  on ConsumedCapacity, which stores pointers to resource.Quantity values:\r\n\r\n```\r\n
  \ type ConsumedCapacity map[resourceapi.QualifiedName]*resource.Quantity\r\n```\r\n\r\n
  \ `CmpRequestOverCapacity()` checks whether adding a new request to currently consumed
  device capacity remains within device capacity. It is intended to perform a temporary
  capacity calculation and must not modify scheduler state, ResourceClaim requests,
  or informer cache objects.\r\n\r\n```\r\n  func CmpRequestOverCapacity(...) {\r\n
  \     ...\r\n      // Build temporary total capacity for this check.\r\n      clone
  := currentConsumedCapacity.Clone()\r\n      ...\r\n      // calculateConsumedCapacity():
  may return a shallow copy of requestedVal, retaining its internal *inf.Dec.\r\n
  \     consumedCapacity := calculateConsumedCapacity(requestedValPtr, cap) // line
  42\r\n      ...\r\n      // Old code: created a new outer Quantity value, but could
  retain a shared internal *inf.Dec pointer.\r\n      clone[name] = ptr.To(consumedCapacity)
  \  // line 51\r\n      // Fixed code: clone[name] = ptr.To(consumedCapacity.DeepCopy())\r\n
  \     ...\r\n      if allocatingVal, allocatingFound := allocatingCapacity[name];
  allocatingFound {\r\n          // Add may mutate clone[name]'s internal *inf.Dec
  in place.\r\n          clone[name].Add(*allocatingVal)  // line 55\r\n      }\r\n
  \ }\r\n```\r\n\r\nIn result, for large decimal requests, adding existing consumption
  can inflate cached ResourceClaim request values.\r\nWithin same scheduler process,
  later reads from informer cache may observe this inflated request value.\r\n\r\n\r\nA
  new unit test proves the error of original code\r\n\r\n```\r\n  Expected\r\n      <[]v1.AllocationResult
  | len:0, cap:0>: nil\r\n  to consist of\r\n      ... two DeviceRequestAllocationResult
  entries ...\r\n\r\n  --- FAIL: TestAllocator/consumable-capacity-requests-are-not-modified\r\n```\r\n\r\n####
  Which issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to
  help with tracking.\r\n\r\nTo automatically close the linked issue(s) when this
  PR is merged,\r\nadd the word \"Fixes\" before the issue number or link.\r\nDo not
  use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs
  when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nDRA
  consumable capacity: fixed a scheduler bug where a ResourceSlice with a device capacity
  requirement stored as a high-precision decimal (a fine-grained fractional value,
  or a value above the int64 range) could have that ResourceSlice mutated in place
  in the informer cache during allocation, which could then make allocation fail incorrectly
  for subsequent pods.\r\n```\r\n\r\n#### Additional documentation e.g., KEPs (Kubernetes
  Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis section can be blank
  if this pull request does not require a release note.\r\n\r\nWhen adding links which
  point to resources within git repositories, like\r\nKEPs or supporting documentation,
  please reference a specific commit and avoid\r\nlinking directly to the master branch.
  This ensures that links reference a\r\nspecific point in time, rather than a document
  that may change over time.\r\n\r\nSee here for guidance on getting permanent links
  to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Fixed a scheduler bug in DRA consumable capacity where a ResourceSlice with
    a device capacity requirement stored as a high-precision decimal, such as a fine-grained
    fractional value or a value above the int64 range, could be mutated in the informer
    cache during allocation. This mutation could incorrectly cause allocation to fail
    for subsequent Pods.
