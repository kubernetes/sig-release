pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n<!--\r\nAdd one of the following kinds:\r\n/kind
  bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind documentation\r\n/kind feature\r\n\r\nOptionally
  add one or more of the following kinds if applicable:\r\n/kind api-change\r\n/kind
  deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n\r\n/kind
  bug\r\n\r\n#### What this PR does / why we need it:\r\n\r\nTo fix and clarify the
  behavior of CapacityRequestPolicyRange when DRA ConsumableCapacity is enabled. \r\n\r\n####
  Which issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to
  help with tracking.\r\n\r\nTo automatically close the linked issue(s) when this
  PR is merged,\r\nadd the word \"Fixes\" before the issue number or link.\r\nDo not
  use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs
  when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\nFixes #140160\r\n\r\nKEP:
  https://github.com/kubernetes/enhancements/issues/5075\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\nFirst solution:\r\n\r\nusing MilliValue. However, this
  can cause validation conflict issue and limit the minimum fraction value at 0.001
  that can be handled. This is a restriction that cannot simply undo. \r\n\r\nFor
  this solution, I had separated the second commit for generated codes updated when
  I added a comment to the CapacityRequestPolicyRange to clarify about the fractional
  quantities. \r\n\r\nThe core code change is in the first commit.\r\n\r\nSecond solution:\r\n\r\nAdvised
  by @pohly . This solution is to calculate within Quantity directly.\r\nI have attached
  the overhead tradeoff in the comment https://github.com/kubernetes/kubernetes/pull/140161#issuecomment-4889598137\r\n\r\n**Third
  solution:**\r\n\r\nAdvised by @liggitt and @pohly . This solution introduces a new
  feature gate to gate the MilliValue validation and calculation. (ref: https://github.com/kubernetes/kubernetes/pull/140161#discussion_r3538161484)\r\n\r\nSame
  as the first solution, I had separated second commit for generated code. The first
  commit included patches from @pohly as a co-author (ref: https://github.com/kubernetes/kubernetes/pull/140161#discussion_r3608188917).\r\n\r\n####
  Does this PR introduce a user-facing change?\r\n<!--\r\nIf no, just write \"NONE\"
  in the release-note block below.\r\nIf yes, a release note is required:\r\nEnter
  your extended release note in the block below. If the PR requires additional action
  from users switching to the new release, include the string \"action required\".\r\n\r\nFor
  more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nFix
  DRA CapacityRequestPolicyRange to support fractional quantities in milli-scale.\r\n```\r\n\r\n####
  Additional documentation e.g., KEPs (Kubernetes Enhancement Proposals), usage docs,
  etc.:\r\n\r\n<!--\r\nThis section can be blank if this pull request does not require
  a release note.\r\n\r\nWhen adding links which point to resources within git repositories,
  like\r\nKEPs or supporting documentation, please reference a specific commit and
  avoid\r\nlinking directly to the master branch. This ensures that links reference
  a\r\nspecific point in time, rather than a document that may change over time.\r\n\r\nSee
  here for guidance on getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Fixed `CapacityRequestPolicyRange` to support fractional quantities in milli-scale.
