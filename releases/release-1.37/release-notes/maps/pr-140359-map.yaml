pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n/kind feature\r\n\r\n<!--\r\nAdd one of the following
  kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind documentation\r\n/kind
  feature\r\n\r\nOptionally add one or more of the following kinds if applicable:\r\n/kind
  api-change\r\n/kind deprecation\r\n/kind failing-test\r\n/kind flake\r\n/kind regression\r\n-->\r\n\r\n####
  What this PR does / why we need it:\r\nAs described in [WAP KEP](https://github.com/kubernetes/enhancements/blob/master/keps/sig-scheduling/5710-workload-aware-preemption/README.md?plain=1#L490),
  all pods within a pod group should have the same preemption policy. This PR adds
  validation to increase our confidence that it's true. The validation runs only if
  the feature gate `PodGroupPreemptionPolicy` is enabled.\r\n\r\nNote that some edge
  cases exist that this validation can miss, e.g. pods assigned directly to a node
  or a race when re-creating a pod group with the same name https://github.com/kubernetes/kubernetes/issues/139914.\r\n\r\n####
  Which issue(s) this PR is related to:\r\nKEP: https://github.com/kubernetes/enhancements/issues/5710\r\n\r\n####
  Special notes for your reviewer:\r\n\r\nCo-authored by AI. I reviewed and corrected
  the changes.\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nAdded
  validation to PodGroup scheduling which, if the feature gate `PodGroupPreemptionPolicy`
  is enabled, ensures that preemption policies of the evaluated pods match the priority
  of the PodGroup.\r\n```\r\n\r\n#### Additional documentation e.g., KEPs (Kubernetes
  Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis section can be blank
  if this pull request does not require a release note.\r\n\r\nWhen adding links which
  point to resources within git repositories, like\r\nKEPs or supporting documentation,
  please reference a specific commit and avoid\r\nlinking directly to the master branch.
  This ensures that links reference a\r\nspecific point in time, rather than a document
  that may change over time.\r\n\r\nSee here for guidance on getting permanent links
  to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n[KEP]: https://github.com/kubernetes/enhancements/issues/5710\r\n```\r\n"
releasenote:
  text: Added validation to PodGroup scheduling that, when the `PodGroupPreemptionPolicy`
    feature gate is enabled, ensures that the preemption policies of Pods being evaluated
    for scheduling match the priority of the PodGroup.
