pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind feature\r\n/kind api-change\r\n\r\n<!--\r\nAdd
  one of the following kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind
  documentation\r\n/kind feature\r\n\r\nOptionally add one or more of the following
  kinds if applicable:\r\n/kind api-change\r\n/kind deprecation\r\n/kind failing-test\r\n/kind
  flake\r\n/kind regression\r\n-->\r\n\r\n#### What this PR does / why we need it:\r\n\r\nThis
  adds Pod-level checkpoint and restore RPCs to the CRI API for KEP-5823. The new
  CRI contract lets kubelet ask a runtime to:\r\n\r\n- Checkpoint a Pod sandbox into
  a runtime-defined directory\r\n- Restore a Pod sandbox from checkpoint data prepared
  by kubelet\r\n- Pass runtime-specific checkpoint and restore options\r\n\r\nCheckpoint
  data remains runtime-defined and is not interpreted by Kubernetes. The CRI only
  defines the interface between kubelet and the container runtime, where checkpoint
  data is written, where restore reads it from, and which pod/container configs are
  supplied at restore time. The checkpoint and restore operations are bounded by the
  caller's gRPC context deadline instead of request timeout fields.\r\n\r\n#### Which
  issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to help with
  tracking.\r\n\r\nTo automatically close the linked issue(s) when this PR is merged,\r\nadd
  the word \"Fixes\" before the issue number or link.\r\nDo not use \"Fixes\" if the
  PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs when applicable in
  addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue number>\r\n<issue
  link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\nKEP: https://github.com/kubernetes/enhancements/issues/5823\r\n\r\n####
  Special notes for your reviewer:\r\n\r\nThis PR only adds the CRI API for Pod-level
  checkpoint and restore. The Kubernetes API objects, kubelet checkpoint orchestration,
  admission, and controller will be introduced in follow up pull requests.\r\n\r\n####
  Does this PR introduce a user-facing change?\r\n<!--\r\nIf no, just write \"NONE\"
  in the release-note block below.\r\nIf yes, a release note is required:\r\nEnter
  your extended release note in the block below. If the PR requires additional action
  from users switching to the new release, include the string \"action required\".\r\n\r\nFor
  more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nAdded
  CheckpointPod and RestorePod RPCs to the CRI v1 RuntimeService API for Pod-level
  checkpoint and restore.\r\n```"
releasenote:
  text: Added CheckpointPod and RestorePod RPCs to the CRI v1 RuntimeService API for
    Pod-level checkpoint and restore.
