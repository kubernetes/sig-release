pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n/kind bug\r\n/sig-windows\r\n/sig-node\r\n\r\n<!--\r\nAdd
  one of the following kinds:\r\n/kind bug\r\n/kind dependency\r\n/kind cleanup\r\n/kind
  documentation\r\n/kind feature\r\n\r\nOptionally add one or more of the following
  kinds if applicable:\r\n/kind api-change\r\n/kind deprecation\r\n/kind failing-test\r\n/kind
  flake\r\n/kind regression\r\n-->\r\n\r\n#### What this PR does / why we need it:\r\nOn
  Windows, when both the CPU Manager (`static` policy) and the Memory Manager\r\nare
  active under the `WindowsCPUAndMemoryAffinity` feature gate,\r\n`computeFinalCpuSet()`
  in `internal_container_lifecycle_windows.go` merged the two\r\nmanagers' results.
  In the partial-overlap case (\"Case 3\" — the CPU Manager's CPUs\r\nfall partly
  outside the Memory Manager's selected NUMA node) it returned the\r\n**union** of
  the CPU Manager's CPUs and *all* of the NUMA node's CPUs:\r\nThat union had two
  problems:\r\n\r\nIsolation violation. The unioned NUMA-node CPUs can include CPUs
  the CPU Manager exclusively allocated to other containers. Those containers are
  pinned to the same CPUs, so the affinity masks overlap and the exclusivity guarantee
  is broken.\r\nReverted by reconciliation. The expanded set is written only into
  the CRI request, never into CPU Manager state. The CPU Manager's reconcileState()
  loop reads state as the source of truth and re-applies the original (smaller) set
  via UpdateContainerResources, so the union is a no-op in steady state.\r\nThis PR
  makes computeFinalCpuSet() always return the CPU Manager's allocated set\r\nwhen
  the CPU Manager has assigned CPUs (collapsing the former Cases 1/2/3). The CPU\r\nManager's
  allocation is authoritative — it already accounts for Topology Manager\r\nhints.
  NUMA-node CPUs are used only when the Memory Manager is the sole provider.\r\n\r\n\r\n####
  Which issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to
  help with tracking.\r\n\r\nTo automatically close the linked issue(s) when this
  PR is merged,\r\nadd the word \"Fixes\" before the issue number or link.\r\nDo not
  use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs
  when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing change?\r\nOn
  Windows nodes with the alpha `WindowsCPUAndMemoryAffinity` feature gate enabled,
  a guaranteed container's CPU affinity now always matches the CPU Manager's exclusive
  allocation. Previously, when the CPU Manager and Memory Manager selected partially
  different NUMA nodes, the affinity could be widened to the union of both sets, which
  could include CPUs exclusively allocated to other containers and break CPU isolation.\r\n\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```\r\nChanges
  behavior of memory affinity on Windows when feature is enabled\r\n```\r\n\r\n####
  Additional documentation e.g., KEPs (Kubernetes Enhancement Proposals), usage docs,
  etc.:\r\n\r\n<!--\r\nThis section can be blank if this pull request does not require
  a release note.\r\n\r\nWhen adding links which point to resources within git repositories,
  like\r\nKEPs or supporting documentation, please reference a specific commit and
  avoid\r\nlinking directly to the master branch. This ensures that links reference
  a\r\nspecific point in time, rather than a document that may change over time.\r\n\r\nSee
  here for guidance on getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Changes behavior of memory affinity on Windows when feature is enabled.
