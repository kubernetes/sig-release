pr_body: "<!--  Thanks for sending a pull request!  Here are some tips for you:\r\n\r\n1.
  If this is your first time, please read our contributor guidelines: https://git.k8s.io/community/contributors/guide/first-contribution.md#your-first-contribution
  and developer guide https://git.k8s.io/community/contributors/devel/development.md#development-guide\r\n2.
  Please label this pull request according to what type of issue you are addressing,
  especially if this is a release targeted pull request. For reference on required
  PR/issue labels, read here:\r\nhttps://git.k8s.io/community/contributors/devel/sig-release/release.md#issuepr-kind-label\r\n3.
  Ensure you have added or ran the appropriate tests for your PR: https://git.k8s.io/community/contributors/devel/sig-testing/testing.md\r\n4.
  If you want *faster* PR reviews, read how: https://git.k8s.io/community/contributors/guide/pull-requests.md#best-practices-for-faster-reviews\r\n5.
  If the PR is unfinished, see how to mark it: https://git.k8s.io/community/contributors/guide/pull-requests.md#marking-unfinished-pull-requests\r\n-->\r\n\r\n####
  What type of PR is this?\r\n\r\n/kind bug\r\n\r\n#### What this PR does / why we
  need it:\r\n\r\nresourceapi.Counter does not directly contain a pointer. However,
  its Value field is a resource.Quantity, and resource.Quantity may indirectly contain
  a mutable pointer to inf.Dec.\r\n\r\nWhen Quantity.d.Dec is non-nil, copying a resourceapi.Counter
  by value also copies Quantity by value, but only copies address of inner *inf.Dec.
  Source Counter and copied Counter then share same mutable decimal object.\r\n\r\n\r\n```\r\n
  \ type counterSets map[draapi.UniqueString]map[string]resourceapi.Counter\r\n\r\n
  \ type Counter struct {\r\n      Value resource.Quantity\r\n       --> type Quantity
  struct {\r\n             i      int64Amount\r\n             d      infDecAmount\r\n
  \            ---> type infDecAmount struct {\r\n                      *inf.Dec    <----------
  \ pointer \r\n                  }\r\n           }\r\n  }\r\n```\r\n\r\nStructured
  DRA allocators copied resourceapi.Counter values into availableCounters and consumedCounters
  caches by value. When a counter quantity used inf.Dec representation, copied values
  retained a shared pointer to mutable decimal state. Without a deep copy, modifying
  a cached counter could also mutate counter values in informer-backed ResourceSlice
  objects. \r\n\r\nit is about Quantity.Sub() and Quantity.Add() , which may modify
  the shared *inf.Dec in place when the quantity uses decimal representation.\r\n\r\nAs
  a result, scheduler could accidentally change original counter capacity published
  by DRA driver.\r\n\r\n```\r\nfunc (alloc *allocator) checkAvailableCounters(device
  deviceWithID) (bool, error) {\r\n\r\n    ...\r\n\tif !found {  \r\n\t\t...\r\n\t\tfor
  name, c := range counterSet.Counters {\r\n\t\t\tavailableCountersForCounterSet[name]
  = c    // line 1659 in this PR file\r\n\t\t}\r\n\t\tavailableCountersForPool[counterSet.Name]
  = availableCountersForCounterSet\r\n\t\t...\r\n\t\t\tavailableCountersForCounterSet
  := availableCountersForPool[deviceCounterConsumption.CounterSet]\r\n\t\t\tfor name,
  c := range deviceCounterConsumption.Counters {\r\n\t\t\t\texistingCounter, ok :=
  availableCountersForCounterSet[name]\r\n\t\t\t\tif !ok {\r\n\t\t\t\t\tcontinue\r\n\t\t\t\t}\r\n\t\t\t\texistingCounter.Value.Sub(c.Value)
  \ // line 1190 in this PR file\t \r\n\t\t\t}\r\n\t}\r\n\r\n}\r\n```\r\n\r\n\r\n####
  Which issue(s) this PR is related to:\r\n<!--\r\nPlease link relevant issues to
  help with tracking.\r\n\r\nTo automatically close the linked issue(s) when this
  PR is merged,\r\nadd the word \"Fixes\" before the issue number or link.\r\nDo not
  use \"Fixes\" if the PR is of kind `failing-test` or `flake`.\r\n\r\nReference KEPs
  when applicable in addition to specific issues.\r\n\r\nExamples:\r\nFixes #<issue
  number>\r\n<issue link> (issue in a different repository)\r\nKEP: https://github.com/kubernetes/enhancements/issues/<kep-issue-number>\r\n\r\nIf
  there is no associated issue, then write \"N/A\".\r\n-->\r\n\r\n#### Special notes
  for your reviewer:\r\n\r\n#### Does this PR introduce a user-facing change?\r\n<!--\r\nIf
  no, just write \"NONE\" in the release-note block below.\r\nIf yes, a release note
  is required:\r\nEnter your extended release note in the block below. If the PR requires
  additional action from users switching to the new release, include the string \"action
  required\".\r\n\r\nFor more information on release notes see: https://git.k8s.io/community/contributors/guide/release-notes.md\r\n-->\r\n```release-note\r\nDRA
  partitionable devices: if a DRA driver published counters which were outside of
  the normal int64 range, the counters in the informer cache got mutated and allocation
  may have failed  incorrectly for future pods.\r\n```\r\n\r\n#### Additional documentation
  e.g., KEPs (Kubernetes Enhancement Proposals), usage docs, etc.:\r\n\r\n<!--\r\nThis
  section can be blank if this pull request does not require a release note.\r\n\r\nWhen
  adding links which point to resources within git repositories, like\r\nKEPs or supporting
  documentation, please reference a specific commit and avoid\r\nlinking directly
  to the master branch. This ensures that links reference a\r\nspecific point in time,
  rather than a document that may change over time.\r\n\r\nSee here for guidance on
  getting permanent links to files: https://help.github.com/en/articles/getting-permanent-links-to-files\r\n\r\nPlease
  use the following format for linking documentation:\r\n- [KEP]: <link>\r\n- [Usage]:
  <link>\r\n- [Other doc]: <link>\r\n-->\r\n```docs\r\n\r\n```\r\n"
releasenote:
  text: Fixed a DRA partitionable devices issue where counters published by a DRA
    driver outside the valid `int64` range could be mutated in the informer cache,
    causing future Pod allocations to fail incorrectly.
